<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMDriven | PMP® Exam Prep, Coaching & Scenario Mindset</title>
    <!-- Google Fonts for a clean, modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b132b;
            color: #e2e8f0;
            line-height: 1.6;
        }

        /* Top Navigation Bar */
        .top-navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(11, 19, 43, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 3rem;
            z-index: 1000;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .brand-logo {
            font-size: 1.4rem;
            font-weight: 800;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-logo span {
            color: #f59e0b;
        }

        .brand-taglines {
            font-size: 0.75rem;
            color: #94a3b8;
            border-left: 1px solid rgba(255, 255, 255, 0.15);
            padding-left: 1rem;
            display: flex;
            gap: 1rem;
        }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .nav-menu a {
            color: #cbd5e1;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .nav-menu a:hover, .nav-menu a.active {
            color: #f59e0b;
        }

        /* Main Container */
        .main-container {
            max-width: 1350px;
            margin: 0 auto;
            padding: 8rem 2rem 4rem 2rem;
        }

        section {
            padding: 4rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        section:last-of-type {
            border-bottom: none;
        }

        /* Hero Section (Concept Layout) */
        .hero-section {
            display: grid;
            grid-template-columns: 1fr 1.1fr;
            gap: 3.5rem;
            align-items: center;
            margin-bottom: 4rem;
        }

        .hero-text h1 {
            font-size: 3.25rem;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.03em;
            color: #ffffff;
            margin-bottom: 1.25rem;
        }

        .hero-text h1 span {
            color: #f59e0b;
        }

        .hero-text p {
            font-size: 1.05rem;
            color: #94a3b8;
            margin-bottom: 2rem;
            line-height: 1.7;
        }

        .hero-cta {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.85rem 1.75rem;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
            display: inline-block;
        }

        .btn-primary {
            background-color: #f59e0b;
            color: #0b132b;
            box-shadow: 0 4px 14px rgba(245, 158, 11, 0.3);
        }

        .btn-primary:hover {
            background-color: #d97706;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.06);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* Concept Hero Right Panel */
        .hero-concept-visual {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.9) 100%);
            border: 1px solid rgba(245, 158, 11, 0.25);
            border-radius: 20px;
            padding: 2.5rem;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .lifecycle-ring {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .lifecycle-node {

            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #f59e0b;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .workspace-banner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(11, 19, 43, 0.6);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .workspace-banner h4 {
            font-size: 1.1rem;
            color: #ffffff;
            margin-bottom: 0.25rem;
        }

        .workspace-banner p {
            font-size: 0.85rem;
            color: #94a3b8;
        }

            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1.25rem;
            margin-top: 3rem;
        }

        .card-compact {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-compact:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
            border-color: rgba(245, 158, 11, 0.4);
        }

        .card-compact .card-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            margin-bottom: 1rem;
            background-color: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
        }

        .card-compact h3 {
            font-size: 1rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.5rem;
        }

        .card-compact p {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 1.25rem;
            line-height: 1.4;
        }

        .card-compact .card-link {
            font-size: 0.8rem;
            font-weight: 600;
            color: #f59e0b;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .card-compact .card-link:hover {
            text-decoration: underline;
        }

        /* Bottom Dual Grid (Founder & Podcast Spotlight) */
        .bottom-spotlight-grid {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 2rem;
            margin-top: 3rem;
        }

        .spotlight-box {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            padding: 2.5rem;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .founder-header {
            display: flex;
            gap: 1.5rem;
            align-items: flex-start;
            margin-bottom: 1.5rem;
        }

        .founder-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f59e0b 0%, #b45309 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            flex-shrink: 0;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .founder-meta h3 {
            font-size: 1.25rem;
            color: #ffffff;
            margin-bottom: 0.25rem;
        }

        .founder-meta p {
            font-size: 0.85rem;
            color: #f59e0b;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .founder-meta span {
            font-size: 0.8rem;
            color: #94a3b8;
            display: block;
        }

        .spotlight-box p {
            color: #cbd5e1;
            font-size: 0.95rem;
            margin-bottom: 1.25rem;
            line-height: 1.6;
        }

        .section-title {
            font-size: 2.25rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 0.75rem;
            letter-spacing: -0.02em;
        }

        .section-desc {
            color: #94a3b8;
            font-size: 1.05rem;
            margin-bottom: 2.5rem;
        }

        /* Podcast Section Styles */
        .podcast-hero-box {
            background: rgba(30, 41, 59, 0.7);
            padding: 2.5rem;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 2rem;
        }

        .podcast-hero-box p {
            color: #cbd5e1;
            margin-bottom: 1rem;
            font-size: 1.05rem;
        }

        .spotify-cta-container {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .spotify-link {
            color: #f59e0b;
            font-weight: 600;
            text-decoration: none;
            word-break: break-all;
        }

        .spotify-link:hover {
            text-decoration: underline;
        }

        .podcast-tagline {
            font-style: italic;
            color: #94a3b8;
            font-weight: 500;
        }

        .podcast-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
